<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>책장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600&display=swap">
<style>
  /* 노션 기본 색 — 「이번 주 조합」 위젯과 같은 값 */
  :root {
    --bg: #ffffff;
    --text: rgb(55, 53, 47);
    --muted: rgba(55, 53, 47, 0.5);
    --line: rgba(55, 53, 47, 0.16);
    --shelf: rgba(55, 53, 47, 0.28);
    --hover: rgba(55, 53, 47, 0.08);
    --shadow: 0 0 0 1px rgba(15,15,15,.05), 0 3px 6px rgba(15,15,15,.1), 0 9px 24px rgba(15,15,15,.2);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #191919; --text: rgba(255,255,255,.81); --muted: rgba(255,255,255,.45);
      --line: rgba(255,255,255,.14); --shelf: rgba(255,255,255,.3); --hover: rgba(255,255,255,.06);
      --shadow: 0 0 0 1px rgba(255,255,255,.08), 0 3px 6px rgba(0,0,0,.4), 0 9px 24px rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #191919; --text: rgba(255,255,255,.81); --muted: rgba(255,255,255,.45);
    --line: rgba(255,255,255,.14); --shelf: rgba(255,255,255,.3); --hover: rgba(255,255,255,.06);
    --shadow: 0 0 0 1px rgba(255,255,255,.08), 0 3px 6px rgba(0,0,0,.4), 0 9px 24px rgba(0,0,0,.5);
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  main { padding: 12px 4px 10px; }
  header { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .theme { border: 0; background: none; color: inherit; cursor: pointer; border-radius: 4px;
           width: 22px; height: 22px; display: grid; place-items: center; padding: 0; }
  .theme:hover { background: var(--hover); }
  .theme svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; }

  section + section { margin-top: 22px; }
  .year { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
  .shelf {
    display: flex; align-items: flex-end; gap: 2px;
    min-height: 40px; padding: 0 6px;
    border-bottom: 2px solid var(--shelf);
  }
  .book {
    position: relative; flex: none; cursor: pointer;
    border-radius: 1.5px 1.5px 0 0;
    background-size: 100% 100%;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.06), inset -1px 0 0 rgba(0,0,0,.08);
    transition: transform .15s ease;
    overflow: hidden;
  }
  .book:hover { transform: translateY(-4px); }
  /* 책등 그림이 없는 책: 표지 색 바탕 + 둥근 책등 음영 + 위아래 띠 + 명조 제목·저자 */
  .book.plain {
    background: var(--c);
    display: flex; flex-direction: column; align-items: center; padding: 11px 0 9px;
  }
  .book.plain::before {
    content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      linear-gradient(to bottom, transparent 5px, var(--rule) 5px, var(--rule) 6px, transparent 6px,
                      transparent calc(100% - 6px), var(--rule) calc(100% - 6px), var(--rule) calc(100% - 5px), transparent calc(100% - 5px)),
      linear-gradient(90deg, rgba(0,0,0,.16) 0%, rgba(255,255,255,.14) 22%, rgba(255,255,255,0) 50%, rgba(0,0,0,.05) 78%, rgba(0,0,0,.2) 100%);
  }
  .book.plain .t, .book.plain .a {
    position: relative; z-index: 2; writing-mode: vertical-rl; white-space: nowrap; overflow: hidden;
    font-family: "Noto Serif KR", "Apple Myungjo", "AppleMyungjo", serif; color: var(--ink); line-height: 1;
  }
  .book.plain .t { flex: 1 1 auto; min-height: 0; font-weight: 600; letter-spacing: .03em; }
  .book.plain .a { flex: none; margin-top: 8px; font-weight: 500; font-size: 8px; letter-spacing: .08em; opacity: .7; }
  .book.reading { opacity: .5; }
  .book.reading:hover { opacity: .8; }
  .book::after { content: ''; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(55,53,47,.16); pointer-events: none; }
  .stats { margin-top: 6px; color: var(--muted); font-size: 12px; }
  .credit { margin-top: 18px; color: var(--muted); font-size: 11px; opacity: .8; }

  .pop {
    position: fixed; z-index: 10; width: 260px; display: none; gap: 10px;
    background: var(--bg); box-shadow: var(--shadow); border-radius: 6px; padding: 10px;
    pointer-events: none;
  }
  .pop.on { display: flex; }
  .pop img { width: 52px; height: 76px; object-fit: cover; border-radius: 2px; flex: none; background: var(--line); }
  .pop b { display: block; font-size: 13px; line-height: 1.35; }
  .pop .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .pop .review { color: var(--muted); font-size: 12px; margin-top: 6px;
                 display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
</style>
</head>
<body>
<main>
  <header>
    <span>책장</span>
    <button class="theme" type="button" aria-label="밝게/어둡게" onclick="toggleTheme()">
      <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11" /><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg>
    </button>
  </header>
  <div id="shelves"></div>
  <p class="credit">도서 정보·책등 이미지 YES24</p>
</main>
<div class="pop" id="pop"><img alt=""><div><b></b><div class="meta"></div><div class="review"></div></div></div>

<script>
// 데이터는 books.enc (맥 lounge-sync가 매일 만들어 올림). 주소 # 뒤의 열쇠(k=…)로 브라우저 안에서만 푼다.
// 열쇠는 서버로 전송되지 않는다(# 뒤는 요청에 실리지 않음). 암호: HMAC-SHA256 카운터 키스트림 + HMAC 태그.
let BOOKS = [];

const MM = 0.68;          // 1mm = 0.68px (225mm 책 ≈ 153px)
const MIN_W = 8;          // 너무 얇은 책도 손가락으로 집히게
const DEF = { tall: 210, thick: 18 };

function lum(hex) {
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
}
function md(s) { const [y, m, d] = s.split('-'); return `${+m}/${+d}`; }

function render() {
  const years = {};
  const thisYear = String(new Date().getFullYear());
  for (const b of BOOKS) {
    const y = b.done ? b.done.slice(0, 4) : (b.status === '읽는 중' ? thisYear : null);
    if (!y) continue;
    (years[y] ||= []).push(b);
  }
  const box = document.getElementById('shelves');
  box.innerHTML = '';
  for (const y of Object.keys(years).sort().reverse()) {
    const list = years[y].sort((a, b) =>
      (a.done ? 0 : 1) - (b.done ? 0 : 1) || (a.done || a.start || '').localeCompare(b.done || b.start || ''));
    const sec = document.createElement('section');
    sec.innerHTML = `<div class="year">${y}</div><div class="shelf"></div><div class="stats"></div>`;
    const shelf = sec.querySelector('.shelf');
    for (const b of list) {
      const el = document.createElement('div');
      el.className = 'book' + (b.spine ? '' : ' plain') + (b.done ? '' : ' reading');
      el.style.height = Math.round((b.tall || DEF.tall) * MM) + 'px';
      el.style.width = Math.max(MIN_W, Math.round((b.thick || DEF.thick) * MM)) + 'px';
      if (b.spine) el.style.backgroundImage = `url("${b.spine}")`;
      else {
        const light = lum(b.color) > .6, w = parseFloat(el.style.width);
        el.style.setProperty('--c', b.color);
        el.style.setProperty('--ink', light ? 'rgba(30,28,24,.82)' : 'rgba(255,255,255,.9)');
        el.style.setProperty('--rule', light ? 'rgba(30,28,24,.28)' : 'rgba(255,255,255,.35)');
        el.innerHTML = `<span class="t" style="font-size:${Math.max(8, Math.min(11, Math.round(w * .58)))}px">${b.title}</span>` +
          (b.author && w >= 11 ? `<span class="a">${b.author.split(/[,·]/)[0].trim()}</span>` : '');
      }
      el.addEventListener('mouseenter', e => show(b, el));
      el.addEventListener('mouseleave', hide);
      el.addEventListener('click', () => window.open(b.url, '_blank'));
      shelf.appendChild(el);
    }
    const done = list.filter(b => b.done), reading = list.filter(b => !b.done);
    const pages = done.reduce((s, b) => s + (b.pages || 0), 0);
    const parts = [];
    if (done.length) parts.push(`완독 ${done.length}권`);
    if (pages) parts.push(`${pages.toLocaleString()}쪽`);
    if (reading.length) parts.push(`읽는 중 ${reading.length}권`);
    sec.querySelector('.stats').textContent = parts.join(' · ');
    box.appendChild(sec);
  }
}

const pop = document.getElementById('pop');
function show(b, el) {
  const im = pop.querySelector('img'); im.removeAttribute('src'); if (b.cover) im.src = b.cover;
  pop.querySelector('b').textContent = b.title;
  pop.querySelector('.meta').textContent =
    b.author + ' · ' + (b.done ? `${md(b.done)} 완독` : `읽는 중 · ${md(b.start)}부터`);
  const rv = pop.querySelector('.review');
  rv.textContent = b.review || '';
  rv.style.display = b.review ? '' : 'none';
  pop.classList.add('on');
  // 책등 오른쪽에 띄우고, 자리가 없으면 왼쪽으로. 세로는 책등 가운데에 맞춤
  const r = el.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = r.right + 8;
  if (left + pw > innerWidth - 4) left = r.left - pw - 8;
  const top = Math.min(Math.max(4, r.top + r.height / 2 - ph / 2), innerHeight - ph - 4);
  pop.style.left = Math.max(4, left) + 'px';
  pop.style.top = top + 'px';
}
function hide() { pop.classList.remove('on'); }

function toggleTheme() {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('shelf-theme', root.dataset.theme); } catch (e) {}
}
try { const t = localStorage.getItem('shelf-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

const b64 = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
async function hmac(key, data) { return new Uint8Array(await crypto.subtle.sign('HMAC', key, data)); }
function cat(...parts) {
  const out = new Uint8Array(parts.reduce((n, p) => n + p.length, 0)); let i = 0;
  for (const p of parts) { out.set(p, i); i += p.length; } return out;
}
async function decrypt(blob, rawKey) {
  const key = await crypto.subtle.importKey('raw', rawKey, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const n = b64(blob.n), c = b64(blob.c), t = b64(blob.t);
  const tag = (await hmac(key, cat(new TextEncoder().encode('tag'), n, c))).slice(0, 16);
  if (tag.length !== t.length || tag.some((x, i) => x !== t[i])) throw new Error('열쇠가 맞지 않아요');
  const out = new Uint8Array(c.length);
  for (let i = 0, ctr = 0; i < c.length; i += 32, ctr++) {
    const cb = new Uint8Array(4); new DataView(cb.buffer).setUint32(0, ctr);
    const ks = await hmac(key, cat(n, cb));
    for (let j = 0; j < 32 && i + j < c.length; j++) out[i + j] = c[i + j] ^ ks[j];
  }
  return JSON.parse(new TextDecoder().decode(out));
}
function notice(text) {
  document.getElementById('shelves').innerHTML = `<p class="stats">${text}</p>`;
}
(async () => {
  if (window.PREVIEW_DATA) { BOOKS = window.PREVIEW_DATA; return render(); }
  const k = new URLSearchParams(location.hash.slice(1)).get('k');
  if (!k) return notice('주소에 열쇠가 없어요.');
  try {
    const blob = await (await fetch('books.enc', { cache: 'no-store' })).json();
    BOOKS = await decrypt(blob, b64(k));
    render();
  } catch (e) { notice('책장을 불러오지 못했어요.'); }
})();
</script>
</body>
</html>
