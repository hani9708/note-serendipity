<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>책장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600&display=swap">
<style>
  /* 노션 기본 색 — 「이번 주 조합」 위젯과 같은 값 */
  :root {
    --bg: #ffffff;
    --text: rgb(55, 53, 47);
    --muted: rgba(55, 53, 47, 0.5);
    --line: rgba(55, 53, 47, 0.16);
    --shelf: rgba(55, 53, 47, 0.28);
    --hover: rgba(55, 53, 47, 0.08);
    --shadow: 0 0 0 1px rgba(15,15,15,.05), 0 3px 6px rgba(15,15,15,.1), 0 9px 24px rgba(15,15,15,.2);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #191919; --text: rgba(255,255,255,.81); --muted: rgba(255,255,255,.45);
      --line: rgba(255,255,255,.14); --shelf: rgba(255,255,255,.3); --hover: rgba(255,255,255,.06);
      --shadow: 0 0 0 1px rgba(255,255,255,.08), 0 3px 6px rgba(0,0,0,.4), 0 9px 24px rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #191919; --text: rgba(255,255,255,.81); --muted: rgba(255,255,255,.45);
    --line: rgba(255,255,255,.14); --shelf: rgba(255,255,255,.3); --hover: rgba(255,255,255,.06);
    --shadow: 0 0 0 1px rgba(255,255,255,.08), 0 3px 6px rgba(0,0,0,.4), 0 9px 24px rgba(0,0,0,.5);
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  main { padding: 12px 4px 10px; }
  header { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .theme { border: 0; background: none; color: inherit; cursor: pointer; border-radius: 4px;
           width: 22px; height: 22px; display: grid; place-items: center; padding: 0; }
  .theme:hover { background: var(--hover); }
  .theme svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; }

  section + section { margin-top: 22px; }
  .year { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
  /* 선반 길이 = 책 너비 + 양옆 여유 (책이 적으면 짧은 선반). 넘치면 그해 책을 줄여 한 줄에 맞춤 */
  .shelf {
    display: inline-flex; align-items: flex-end; gap: 2px; max-width: 100%;
    min-height: 40px; min-width: 160px; padding: 0 12px;
    border-bottom: 2px solid var(--shelf);
  }
  .book {
    position: relative; flex: none; cursor: pointer;
    border-radius: 1.5px 1.5px 0 0;
    background-size: 100% 100%;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.06), inset -1px 0 0 rgba(0,0,0,.08);
    transition: transform .15s ease;
    overflow: hidden;
  }
  .book:hover { transform: translateY(-4px); }
  /* 책등 그림이 없는 책: 표지 색 바탕 + 둥근 책등 음영 + 위아래 띠 + 명조 제목·저자 */
  .book.plain {
    background: var(--c);
    display: flex; flex-direction: column; align-items: center; padding: 11px 0 9px;
  }
  .book.plain::before {
    content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      linear-gradient(to bottom, transparent 5px, var(--rule) 5px, var(--rule) 6px, transparent 6px,
                      transparent calc(100% - 6px), var(--rule) calc(100% - 6px), var(--rule) calc(100% - 5px), transparent calc(100% - 5px)),
      linear-gradient(90deg, rgba(0,0,0,.16) 0%, rgba(255,255,255,.14) 22%, rgba(255,255,255,0) 50%, rgba(0,0,0,.05) 78%, rgba(0,0,0,.2) 100%);
  }
  .book.plain .t, .book.plain .a {
    position: relative; z-index: 2; writing-mode: vertical-rl; white-space: nowrap; overflow: hidden;
    font-family: "Noto Serif KR", "Apple Myungjo", "AppleMyungjo", serif; color: var(--ink); line-height: 1;
  }
  .book.plain .t { flex: 1 1 auto; min-height: 0; font-weight: 600; letter-spacing: .03em; }
  .book.plain .a { flex: none; margin-top: 8px; font-weight: 500; font-size: 8px; letter-spacing: .08em; opacity: .7; }
  .book.reading { opacity: .5; }
  .book.reading:hover { opacity: .8; }
  .book::after { content: ''; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(55,53,47,.16); pointer-events: none; }
  /* 누적 책장 */
  .row { display: flex; width: 100%; min-width: 0; margin-top: 20px; }
  .book { transition: transform .2s ease, opacity .2s ease, filter .2s ease; }
  .book.lift { transform: translateY(-10px); }
  /* 칸막이 = 책보다 살짝 높이 솟은 얇은 색인 카드, 연도는 세로 명조 */
  .divider {
    flex: none; width: 11px; align-self: stretch; margin-top: -12px; cursor: default;
    display: flex; justify-content: center; padding-top: 6px;
    background: var(--bg); border: 1px solid var(--line); border-bottom: 0; border-radius: 3px 3px 0 0;
    box-shadow: 1px 0 2px rgba(0,0,0,.18); transition: opacity .2s ease, border-color .2s ease;
  }
  .divider span {
    writing-mode: vertical-rl; font-family: "Noto Serif KR", "Apple Myungjo", serif;
    font-size: 9px; font-weight: 600; letter-spacing: .5px; color: var(--muted); transition: color .2s ease;
  }
  .divider.on { border-color: var(--muted); }
  .divider.on span { color: var(--text); }
  /* 칸막이에 마우스: 그해 책만 떠오르고 나머지는 어둡고 흐리게 */
  #shelves.focus .book:not(.lift) { opacity: .18; filter: grayscale(.6); }
  #shelves.focus .divider:not(.on) { opacity: .25; }
  #shelves.focus .book.reading.lift { opacity: .75; }
  .tip {
    position: fixed; z-index: 10; display: none; white-space: nowrap; pointer-events: none;
    background: var(--bg); box-shadow: var(--shadow); border-radius: 6px; padding: 5px 9px; font-size: 12px;
  }
  .tip.on { display: block; }
  .shelf.full { display: flex; width: 100%; }
  .stats.sub { margin-top: 2px; opacity: .8; }
  .stats { margin-top: 6px; color: var(--muted); font-size: 12px; }
  .credit { margin-top: 18px; color: var(--muted); font-size: 11px; opacity: .8; }

  .pop {
    position: fixed; z-index: 10; width: 260px; display: none; gap: 10px;
    background: var(--bg); box-shadow: var(--shadow); border-radius: 6px; padding: 10px;
    pointer-events: none;
  }
  .pop.on { display: flex; }
  .pop img { width: 52px; height: 76px; object-fit: cover; border-radius: 2px; flex: none; background: var(--line); }
  .pop b { display: block; font-size: 13px; line-height: 1.35; }
  .pop .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .pop .review { color: var(--muted); font-size: 12px; margin-top: 6px;
                 display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
</style>
</head>
<body>
<main>
  <header>
    <span id="label">책장</span>
    <button class="theme" type="button" aria-label="밝게/어둡게" onclick="toggleTheme()">
      <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11" /><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg>
    </button>
  </header>
  <div id="shelves"></div>
  <p class="credit">도서 정보·책등 이미지 YES24 · 표지 이미지 교보문고</p>
</main>
<div class="pop" id="pop"><img alt=""><div><b></b><div class="meta"></div><div class="review"></div></div></div>

<script>
// 데이터는 books.enc (맥 lounge-sync가 매일 만들어 올림). 주소 # 뒤의 열쇠(k=…)로 브라우저 안에서만 푼다.
// 열쇠는 서버로 전송되지 않는다(# 뒤는 요청에 실리지 않음). 암호: HMAC-SHA256 카운터 키스트림 + HMAC 태그.
let BOOKS = [], STACKS = {};

const MM = 0.68;          // 1mm = 0.68px (225mm 책 ≈ 153px)
const MIN_W = 8;          // 너무 얇은 책도 손가락으로 집히게
const DEF = { tall: 210, thick: 18 };

function lum(hex) {
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
}
function md(s) { const [y, m, d] = s.split('-'); return `${+m}/${+d}`; }

// 보기: 주소에 ?view=all 이면 누적 책장(연도 칸막이, 줄바꿈), 아니면 올해 책장
const VIEW = new URLSearchParams(location.search).get('view') === 'all' ? 'all' : 'year';
const THIS_YEAR = String(new Date().getFullYear());
const yearOf = b => b.done ? b.done.slice(0, 4) : (b.status === '읽는 중' ? THIS_YEAR : null);
const order = (a, b) => (a.done ? 0 : 1) - (b.done ? 0 : 1) || (a.done || a.start || '').localeCompare(b.done || b.start || '');

function makeBook(b, k) {
  const el = document.createElement('div');
  el.className = 'book' + (b.spine ? '' : ' plain') + (b.done ? '' : ' reading');
  el.style.height = ((b.tall || DEF.tall) * MM * k).toFixed(1) + 'px';
  el.style.width = (Math.max(MIN_W, (b.thick || DEF.thick) * MM) * k).toFixed(1) + 'px';
  if (b.spine) el.style.backgroundImage = `url("${b.spine}")`;
  else {
    const light = lum(b.color) > .6, w = parseFloat(el.style.width);
    el.style.setProperty('--c', b.color);
    el.style.setProperty('--ink', light ? 'rgba(30,28,24,.82)' : 'rgba(255,255,255,.9)');
    el.style.setProperty('--rule', light ? 'rgba(30,28,24,.28)' : 'rgba(255,255,255,.35)');
    el.innerHTML = `<span class="t" style="font-size:${Math.max(8, Math.min(11, Math.round(w * .58)))}px">${b.title}</span>` +
      (b.author && w >= 11 ? `<span class="a">${b.author.split(/[,·]/)[0].trim()}</span>` : '');
  }
  el.addEventListener('mouseenter', () => show(b, el));
  el.addEventListener('mouseleave', hide);
  el.addEventListener('click', () => window.open(b.url, '_blank'));
  return el;
}

function stats(list) {
  const done = list.filter(b => b.done), reading = list.filter(b => !b.done);
  const pages = done.reduce((s, b) => s + (b.pages || 0), 0);
  const parts = [];
  if (done.length) parts.push(`완독 ${done.length}권`);
  if (pages) parts.push(`${pages.toLocaleString()}쪽`);
  if (reading.length) parts.push(`읽는 중 ${reading.length}권`);
  return parts.join(' · ');
}

function render() { VIEW === 'all' ? renderAll() : renderYear(); }

// 올해 책장: 올해 완독 + 읽는 중만. 선반은 끝까지, 책은 임베드 높이·폭에 맞춰 키우거나 줄인다
function renderYear() {
  const list = BOOKS.filter(b => yearOf(b) === THIS_YEAR).sort(order);
  const box = document.getElementById('shelves');
  box.innerHTML = '';
  const sec = document.createElement('section');
  sec.innerHTML = `<div class="year">${THIS_YEAR}</div><div class="shelf full"></div><div class="stats"></div><div class="stats sub"></div>`;
  const shelf = sec.querySelector('.shelf');
  box.appendChild(sec);
  sec.querySelector('.stats').textContent = stats(list) || '아직 올해 읽은 책이 없어요.';
  const sub = yearStats(list);
  sec.querySelector('.stats.sub').textContent = sub;
  if (!sub) sec.querySelector('.stats.sub').remove();
  if (!list.length) return;
  // 폭: 한 줄에 다 들어가게 / 높이: 임베드 높이 안에서 가장 큰 책이 꽉 차게 (최대 1.8배)
  const need = list.reduce((s, b) => s + Math.max(MIN_W, (b.thick || DEF.thick) * MM), 0);
  const kW = (box.clientWidth - 24 - 2 * (list.length - 1) - 2) / need;
  const tallest = Math.max(...list.map(b => (b.tall || DEF.tall) * MM));
  const other = document.querySelector('main').offsetHeight - shelf.offsetHeight;
  const kH = (innerHeight - other - 14) / tallest;
  const k = Math.max(.3, Math.min(kW, kH, 1.8));
  for (const b of list) shelf.appendChild(makeBook(b, k));
}

// 연간 통계 한 줄: 가장 많이 읽은 달 · 많이 읽은 분류 · 💎 인생작 · 스택 (해당 없는 항목은 뺀다)
function yearStats(list) {
  const done = list.filter(b => b.done), parts = [];
  const top = (arr) => {
    const c = {}; arr.forEach(x => { if (x) c[x] = (c[x] || 0) + 1; });
    const max = Math.max(0, ...Object.values(c));
    return [Object.keys(c).filter(k => c[k] === max), max];
  };
  const [months, mN] = top(done.map(b => +b.done.slice(5, 7)));
  if (mN) parts.push(`${months.sort((a, b) => a - b).join('·')}월에 가장 많이(${mN}권)`);
  const [cats, cN] = top(done.map(b => b.cat));
  if (cN) parts.push(`${cats.slice(0, 2).join('·')} ${cN}권`);
  const gems = done.filter(b => (b.feel || '').includes('인생작')).length;
  if (gems) parts.push(`💎 인생작 ${gems}권`);
  if (STACKS[THIS_YEAR]) parts.push(`스택 ${STACKS[THIS_YEAR]}개`);
  return parts.join(' · ');
}

// 누적 책장: 오래된 해부터 한 줄로 이어 꽂고, 해가 바뀌는 자리에 칸막이. 줄이 차면 다음 칸으로
function renderAll() {
  const years = {};
  for (const b of BOOKS) { const y = yearOf(b); if (y) (years[y] ||= []).push(b); }
  const box = document.getElementById('shelves');
  box.innerHTML = '';
  const items = [];
  for (const y of Object.keys(years).sort()) {
    items.push({ divider: y, list: years[y] });
    for (const b of years[y].sort(order)) items.push({ book: b, year: y });
  }
  const avail = box.clientWidth - 24, GAP = 2, DIV_W = 14;
  let row = null, used = 0;
  const newRow = () => { row = document.createElement('div'); row.className = 'shelf row'; box.appendChild(row); used = 0; };
  newRow();
  for (const it of items) {
    const w = it.divider ? DIV_W : Math.max(MIN_W, (it.book.thick || DEF.thick) * MM);
    if (used && used + GAP + w > avail) newRow();
    used += (used ? GAP : 0) + w;
    if (it.divider) {
      const d = document.createElement('div');
      d.className = 'divider';
      d.innerHTML = `<span>${it.divider}</span>`;
      d.addEventListener('mouseenter', () => lift(it.divider, d, it.list));
      d.addEventListener('mouseleave', () => lift(null));
      row.appendChild(d);
    } else {
      const el = makeBook(it.book, 1);
      el.dataset.year = it.year;
      row.appendChild(el);
    }
  }
  const all = Object.values(years).flat();
  const ys = Object.keys(years).sort();
  const tot = document.createElement('div');
  tot.className = 'stats';
  tot.textContent = all.length ? `${ys[0]}${ys.length > 1 ? '–' + ys[ys.length - 1] : ''} · ${stats(all)}` : '아직 꽂힌 책이 없어요.';
  box.appendChild(tot);
}

// 칸막이에 마우스: 그해 책이 모두 조금 떠오르고, 칸막이 옆에 그해 합계
const tip = document.createElement('div');
tip.className = 'tip';
document.body.appendChild(tip);
function lift(y, d, list) {
  document.querySelectorAll('.book.lift').forEach(e => e.classList.remove('lift'));
  document.querySelectorAll('.divider.on').forEach(e => e.classList.remove('on'));
  document.getElementById('shelves').classList.toggle('focus', !!y);
  if (!y) { tip.classList.remove('on'); return; }
  document.querySelectorAll(`.book[data-year="${y}"]`).forEach(e => e.classList.add('lift'));
  d.classList.add('on');
  tip.textContent = `${y} · ${stats(list)}`;
  tip.classList.add('on');
  const r = d.getBoundingClientRect();
  let left = r.right + 6;
  if (left + tip.offsetWidth > innerWidth - 4) left = r.left - tip.offsetWidth - 6;
  tip.style.left = Math.max(4, left) + 'px';
  tip.style.top = Math.max(4, r.top - 4) + 'px';
}

const pop = document.getElementById('pop');
function show(b, el) {
  const im = pop.querySelector('img'); im.removeAttribute('src'); if (b.cover) im.src = b.cover;
  pop.querySelector('b').textContent = b.title;
  pop.querySelector('.meta').textContent =
    b.author + ' · ' + (b.done ? `${md(b.done)} 완독` : `읽는 중 · ${md(b.start)}부터`);
  const rv = pop.querySelector('.review');
  rv.textContent = b.review || '';
  rv.style.display = b.review ? '' : 'none';
  pop.classList.add('on');
  // 책등 오른쪽에 띄우고, 자리가 없으면 왼쪽으로. 세로는 책등 가운데에 맞춤
  const r = el.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = r.right + 8;
  if (left + pw > innerWidth - 4) left = r.left - pw - 8;
  const top = Math.min(Math.max(4, r.top + r.height / 2 - ph / 2), innerHeight - ph - 4);
  pop.style.left = Math.max(4, left) + 'px';
  pop.style.top = top + 'px';
}
function hide() { pop.classList.remove('on'); }

let resizeTimer;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => BOOKS.length && render(), 150); });

function toggleTheme() {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('shelf-theme', root.dataset.theme); } catch (e) {}
}
try { const t = localStorage.getItem('shelf-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

const b64 = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
async function hmac(key, data) { return new Uint8Array(await crypto.subtle.sign('HMAC', key, data)); }
function cat(...parts) {
  const out = new Uint8Array(parts.reduce((n, p) => n + p.length, 0)); let i = 0;
  for (const p of parts) { out.set(p, i); i += p.length; } return out;
}
async function decrypt(blob, rawKey) {
  const key = await crypto.subtle.importKey('raw', rawKey, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const n = b64(blob.n), c = b64(blob.c), t = b64(blob.t);
  const tag = (await hmac(key, cat(new TextEncoder().encode('tag'), n, c))).slice(0, 16);
  if (tag.length !== t.length || tag.some((x, i) => x !== t[i])) throw new Error('열쇠가 맞지 않아요');
  const out = new Uint8Array(c.length);
  for (let i = 0, ctr = 0; i < c.length; i += 32, ctr++) {
    const cb = new Uint8Array(4); new DataView(cb.buffer).setUint32(0, ctr);
    const ks = await hmac(key, cat(n, cb));
    for (let j = 0; j < 32 && i + j < c.length; j++) out[i + j] = c[i + j] ^ ks[j];
  }
  return JSON.parse(new TextDecoder().decode(out));
}
if (VIEW === 'all') document.getElementById('label').textContent = '누적 책장';
// 데이터: 예전 형식(책 배열) 또는 { books, stacks: {연도: 스택 수} }
function load(p) { BOOKS = Array.isArray(p) ? p : (p.books || []); STACKS = (!Array.isArray(p) && p.stacks) || {}; }
function notice(text) {
  document.getElementById('shelves').innerHTML = `<p class="stats">${text}</p>`;
}
(async () => {
  if (window.PREVIEW_DATA) { load(window.PREVIEW_DATA); return render(); }
  const k = new URLSearchParams(location.hash.slice(1)).get('k');
  if (!k) return notice('주소에 열쇠가 없어요.');
  try {
    const blob = await (await fetch('books.enc', { cache: 'no-store' })).json();
    load(await decrypt(blob, b64(k)));
    render();
  } catch (e) { notice('책장을 불러오지 못했어요.'); }
})();
</script>
</body>
</html>
