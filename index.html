<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>이번 주 조합</title>
<style>
  /* Notion 기본 색 */
  :root {
    --bg: #ffffff;
    --text: rgb(55, 53, 47);
    --muted: rgba(55, 53, 47, 0.5);
    --line: rgba(55, 53, 47, 0.16);
    --underline: rgba(55, 53, 47, 0.25);
    --hover: rgba(55, 53, 47, 0.08);
    --dot: rgba(55, 53, 47, 0.2);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #191919;
      --text: rgba(255, 255, 255, 0.81);
      --muted: rgba(255, 255, 255, 0.45);
      --line: rgba(255, 255, 255, 0.14);
      --underline: rgba(255, 255, 255, 0.28);
      --hover: rgba(255, 255, 255, 0.06);
      --dot: rgba(255, 255, 255, 0.22);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #191919;
    --text: rgba(255, 255, 255, 0.81);
    --muted: rgba(255, 255, 255, 0.45);
    --line: rgba(255, 255, 255, 0.14);
    --underline: rgba(255, 255, 255, 0.28);
    --hover: rgba(255, 255, 255, 0.06);
    --dot: rgba(255, 255, 255, 0.22);
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Display", "Segoe UI", Helvetica, "Apple SD Gothic Neo", "Noto Sans KR", "Apple Color Emoji", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  main {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    padding: 12px 4px 10px;
  }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 12px;
  }
  .title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .week { margin-left: 6px; opacity: .8; }
  .dots { display: flex; gap: 2px; }
  .dots button, .theme {
    border: 0; background: none; color: inherit; cursor: pointer;
    border-radius: 4px; font: inherit;
  }
  .dots button { width: 18px; height: 18px; display: grid; place-items: center; padding: 0; }
  .dots button::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--dot);
  }
  .dots button[aria-current="true"]::before { background: var(--text); opacity: .7; }
  .dots button:hover, .theme:hover { background: var(--hover); }
  .theme { width: 22px; height: 22px; display: grid; place-items: center; padding: 0; }
  .theme svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; }
  :focus-visible { outline: 2px solid rgba(35, 131, 226, 0.6); outline-offset: 1px; }

  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 14px 0 6px;
    transition: opacity .35s ease;
  }
  .stage.fading { opacity: 0; }

  .facing {
    display: grid;
    grid-template-columns: minmax(0, 17em) 1px minmax(0, 17em);
    justify-content: center;
    gap: 0 20px;
    align-items: center;
  }
  .seam { align-self: stretch; background: var(--line); }
  .note { min-width: 0; text-wrap: balance; }
  .note.a { text-align: right; }
  .note a {
    color: inherit;
    font-weight: 500;
    text-decoration: none;
    border-bottom: 1px solid var(--underline);
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  .note a:hover { border-bottom-color: var(--text); }
  .area { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); }

  .question {
    margin: 12px auto 0;
    max-width: 36em;
    text-align: center;
    text-wrap: balance;
    font-size: 14.5px;
    word-break: keep-all;
  }
  .question::before { content: "💬 "; }

  .empty { color: var(--muted); font-size: 13px; }

  @media (max-width: 480px) {
    .facing { grid-template-columns: 1fr; justify-content: stretch; gap: 6px 0; }
    .note.a { text-align: left; }
    .seam { display: none; }
    .question { text-align: left; }
  }
  @media (prefers-reduced-motion: reduce) { .stage { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <span class="title">이번 주에 마주 놓을 노트 <span class="week" id="week"></span></span>
    <nav class="dots" id="dots" aria-label="조합 고르기"></nav>
    <button class="theme" id="theme" type="button"></button>
  </header>
  <section class="stage" id="stage" aria-live="polite"></section>
</main>
<script>
  const ROTATE_MS = 10 * 60 * 1000;  // 한 조합을 보여주는 시간 (10분)
  const REFETCH_MS = 30 * 60 * 1000; // 새 주 조합을 다시 읽어오는 간격
  const DISTANCE = { near: "가까운 짝", far: "먼 짝" };

  /* ---------- 테마: 자동 → 라이트 → 다크 ---------- */
  const THEMES = ["auto", "light", "dark"];
  const ICONS = {
    auto: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11" /><path d="M8 2.5a5.5 5.5 0 0 0 0 11z" fill="currentColor" stroke="none"/></svg>',
    light: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1"/></svg>',
    dark: '<svg viewBox="0 0 16 16"><path d="M13 9.5A5.5 5.5 0 0 1 6.5 3a5.5 5.5 0 1 0 6.5 6.5z"/></svg>'
  };
  const LABEL = { auto: "테마: 시스템 따라가기", light: "테마: 라이트", dark: "테마: 다크" };
  let theme = "auto";
  try { theme = localStorage.getItem("ns-theme") || "auto"; } catch (e) {}
  const themeBtn = document.getElementById("theme");
  function applyTheme() {
    if (theme === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", theme);
    themeBtn.innerHTML = ICONS[theme];
    themeBtn.title = themeBtn.ariaLabel = LABEL[theme];
  }
  themeBtn.addEventListener("click", () => {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    try { localStorage.setItem("ns-theme", theme); } catch (e) {}
    applyTheme();
  });
  applyTheme();

  /* ---------- 조합 표시 ---------- */
  let data = null, index = 0, timer = null, paused = false;
  const stage = document.getElementById("stage");
  const dots = document.getElementById("dots");

  function weekLabel(iso) {
    const d = new Date(iso + "T00:00:00");
    return `${d.getMonth() + 1}월 ${d.getDate()}일 주`;
  }

  function noteEl(n, side) {
    const wrap = document.createElement("div");
    wrap.className = "note " + side;
    const a = document.createElement("a");
    a.href = "https://www.notion.so/" + n.id.replace(/-/g, "");
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = n.title;
    wrap.appendChild(a);
    if (n.area) {
      const s = document.createElement("span");
      s.className = "area";
      s.textContent = n.area;
      wrap.appendChild(s);
    }
    return wrap;
  }

  function draw() {
    const p = data.pairs[index];
    const facing = document.createElement("div");
    facing.className = "facing";
    const seam = document.createElement("div");
    seam.className = "seam";
    facing.append(noteEl(p.a, "a"), seam, noteEl(p.b, "b"));
    const q = document.createElement("p");
    q.className = "question";
    q.textContent = p.question;
    stage.replaceChildren(facing, q);
    [...dots.children].forEach((b, i) => b.setAttribute("aria-current", i === index ? "true" : "false"));
  }

  function show(i, animate = true) {
    index = (i + data.pairs.length) % data.pairs.length;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!animate || reduce) { draw(); return; }
    stage.classList.add("fading");
    setTimeout(() => { draw(); stage.classList.remove("fading"); }, 350);
  }

  function restartTimer() {
    clearInterval(timer);
    timer = setInterval(() => { if (!paused && !document.hidden) show(index + 1); }, ROTATE_MS);
  }

  function render(d) {
    const sameWeek = data && data.week === d.week;
    data = d;
    document.getElementById("week").textContent = weekLabel(d.week);
    dots.replaceChildren(...d.pairs.map((p, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.ariaLabel = `${i + 1}번째 조합 (${DISTANCE[p.kind] || ""})`;
      b.title = DISTANCE[p.kind] || "";
      b.addEventListener("click", () => { show(i); restartTimer(); });
      return b;
    }));
    show(sameWeek ? index : 0, false);
    restartTimer();
  }

  function load() {
    return fetch("current.json?t=" + Date.now(), { cache: "no-store" })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(render)
      .catch(() => {
        if (!data) stage.innerHTML = '<p class="empty">이번 주 조합을 불러오지 못했어요. 노션 페이지를 새로 고쳐 주세요.</p>';
      });
  }

  document.querySelector("main").addEventListener("mouseenter", () => paused = true);
  document.querySelector("main").addEventListener("mouseleave", () => paused = false);
  document.addEventListener("focusin", () => paused = true);
  document.addEventListener("focusout", () => paused = false);

  load();
  setInterval(load, REFETCH_MS);
</script>
</body>
</html>
