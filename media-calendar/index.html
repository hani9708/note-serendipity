<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>감상 캘린더</title>
<style>
  /* 노션 기본 색 — 책장 위젯과 같은 값 */
  :root {
    --bg: #ffffff;
    --text: rgb(55, 53, 47);
    --muted: rgba(55, 53, 47, 0.5);
    --faint: rgba(55, 53, 47, 0.25);
    --line: rgba(55, 53, 47, 0.09);
    --hover: rgba(55, 53, 47, 0.06);
    --shadow: 0 0 0 1px rgba(15,15,15,.05), 0 3px 6px rgba(15,15,15,.1), 0 9px 24px rgba(15,15,15,.2);
    --dotL: 0.48;
    --c-gray: #9b9a97; --c-brown: #9f6b53; --c-orange: #d9730d; --c-yellow: #cb912f; --c-green: #448361;
    --c-blue: #337ea9; --c-purple: #9065b0; --c-pink: #c14c8a; --c-red: #d44c47;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #191919; --text: rgba(255,255,255,.81); --muted: rgba(255,255,255,.45); --faint: rgba(255,255,255,.2);
      --line: rgba(255,255,255,.08); --hover: rgba(255,255,255,.05);
      --shadow: 0 0 0 1px rgba(255,255,255,.08), 0 3px 6px rgba(0,0,0,.4), 0 9px 24px rgba(0,0,0,.5);
      --dotL: 0.62;
      --c-gray: #9b9b9b; --c-brown: #ba856f; --c-orange: #c77d48; --c-yellow: #ca9849; --c-green: #529e72;
      --c-blue: #5e87c9; --c-purple: #9d68d3; --c-pink: #d15796; --c-red: #df5452;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #191919; --text: rgba(255,255,255,.81); --muted: rgba(255,255,255,.45); --faint: rgba(255,255,255,.2);
    --line: rgba(255,255,255,.08); --hover: rgba(255,255,255,.05);
    --shadow: 0 0 0 1px rgba(255,255,255,.08), 0 3px 6px rgba(0,0,0,.4), 0 9px 24px rgba(0,0,0,.5);
    --dotL: 0.62;
      --c-gray: #9b9b9b; --c-brown: #ba856f; --c-orange: #c77d48; --c-yellow: #ca9849; --c-green: #529e72;
      --c-blue: #5e87c9; --c-purple: #9d68d3; --c-pink: #d15796; --c-red: #df5452;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  main { padding: 12px 4px 10px; }
  header { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; border-radius: 4px; padding: 0; }
  button:hover:not(:disabled) { background: var(--hover); }
  button:disabled { opacity: .3; cursor: default; }
  .theme { width: 22px; height: 22px; display: grid; place-items: center; }
  .theme svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; }

  .bar { display: flex; align-items: center; gap: 2px; margin-bottom: 6px; }
  .month { font-size: 15px; font-weight: 600; padding: 0 4px; }
  .bar .sp { flex: 1; }
  .mode { width: 24px; height: 24px; display: grid; place-items: center; color: var(--faint); }
  .mode.on { color: var(--text); background: var(--hover); }
  .mode svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; }
  .modes { display: flex; gap: 2px; margin-left: 10px; padding-left: 10px; border-left: 1px solid var(--line); }
  /* 기간 막대 보기 */
  .grid { position: relative; }
  .lanes { position: absolute; inset: 0; pointer-events: none; }
  .seg { position: absolute; height: 6px; pointer-events: auto; cursor: pointer; opacity: 1; transition: opacity .15s, transform .15s; }
  .seg.l { border-top-left-radius: 3px; border-bottom-left-radius: 3px; }
  .seg.r { border-top-right-radius: 3px; border-bottom-right-radius: 3px; }
  .seg.open { -webkit-mask-image: linear-gradient(90deg, #000 70%, transparent); mask-image: linear-gradient(90deg, #000 70%, transparent); }
  .lanes.focus .seg:not(.hl) { opacity: .2; }
  .seg.hl { opacity: 1; }
  .tip { position: fixed; z-index: 10; display: none; white-space: nowrap; pointer-events: none;
         background: var(--bg); box-shadow: var(--shadow); border-radius: 6px; padding: 5px 9px; font-size: 12px; }
  .tip.on { display: block; }
  .tip .s { color: var(--muted); }
  .nav { width: 24px; height: 24px; color: var(--muted); font-size: 16px; line-height: 1; }

  .week, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .week div { color: var(--muted); font-size: 12px; text-align: right; padding: 0 6px 4px; }
  .grid { border-left: 1px solid var(--line); border-top: 1px solid var(--line); }
  .day {
    position: relative; aspect-ratio: 5 / 4; padding: 3px 6px;
    border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
    overflow: hidden;
  }
  .day.other .n { color: var(--faint); }
  .day.has { cursor: pointer; }
  .day.has:hover, .day.open { background: var(--hover); }
  .n { font-size: 12px; color: var(--muted); text-align: right; line-height: 20px; }
  .today .n span {
    display: inline-block; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px;
    background: var(--text); color: var(--bg); text-align: center; font-weight: 600;
  }
  .covers { position: absolute; left: 6px; top: 6px; bottom: 6px; display: flex; }
  .covers img {
    height: 100%; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 2px; background: var(--line);
    box-shadow: 0 0 0 1px var(--line), 0 1px 3px rgba(0,0,0,.15);
  }
  .covers img + img { margin-left: -60%; }
  .dots { position: absolute; right: 6px; bottom: 6px; display: flex; flex-wrap: wrap-reverse; justify-content: flex-end;
          gap: 3px; max-width: 46px; align-items: center; }
  .dot { width: 7px; height: 7px; border-radius: 50%; }
  .more { font-size: 10px; color: var(--muted); line-height: 7px; }

  .stats { margin-top: 8px; color: var(--muted); font-size: 12px; }
  .credit { margin-top: 14px; color: var(--muted); font-size: 11px; opacity: .8; }

  .pop {
    position: fixed; z-index: 10; width: 280px; display: none;
    background: var(--bg); box-shadow: var(--shadow); border-radius: 6px; padding: 6px;
    max-height: 70vh; overflow: auto;
  }
  .pop.on { display: block; }
  .pop .head { color: var(--muted); font-size: 12px; padding: 2px 6px 4px; }
  .pop a { display: flex; gap: 8px; align-items: flex-start; padding: 5px 6px; border-radius: 4px; color: inherit; text-decoration: none; }
  .pop a:hover { background: var(--hover); }
  .pop a img { width: 28px; height: 40px; object-fit: cover; border-radius: 2px; flex: none; background: var(--line); }
  .pop a .dot { flex: none; margin-top: 6px; }
  .pop b { display: block; font-size: 13px; font-weight: 600; line-height: 1.35; }
  .pop .t { font-size: 13px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pop .s { color: var(--muted); font-size: 12px; line-height: 1.35; margin-top: 1px; }
</style>
</head>
<body>
<main>
  <header>
    <span>감상 캘린더</span>
    <button class="theme" type="button" aria-label="테마" onclick="toggleTheme()">
      <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11" /><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg>
    </button>
  </header>
  <div id="cal"></div>
  <p class="credit">포스터 TMDB · Steam</p>
</main>
<div class="pop" id="pop"></div>

<script>
// 데이터는 감상 현황 위젯과 같은 ../archive/media.enc (맥 lounge-sync가 매시간 올림): 영상·게임 DB의 관람완료·관람중 작품.
// 화면 코드는 독서 캘린더와 같고, 작품을 책 모양({title, done, start, …})으로 바꿔 넣는다. 스택 점은 없다.
// 주소 # 뒤의 열쇠(k=…)로 브라우저 안에서만 푼다. 열쇠는 서버로 전송되지 않는다.
let DATA = { books: {}, notes: [] };
let byDay = {};               // 'YYYY-MM-DD' → { done: [bookId], notes: [note] }
let cur, minYM, maxYM;        // 보고 있는 달·이동 범위 (연*12+월)

const WD = ['일', '월', '화', '수', '목', '금', '토'];
const KIND = { movie: '영화', series: '시리즈', show: '예능', docu: '다큐', game: '게임', stage: '공연' };
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const ym = s => +s.slice(0, 4) * 12 + (+s.slice(5, 7) - 1);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// 표지에서 뽑은 색은 너무 밝거나 어두울 수 있어서, 점으로 쓸 때만 밝기를 테마에 맞게 고정한다
function dotColor(hex) {
  const n = parseInt((hex || '#999999').slice(1), 16);
  let r = (n >> 16) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
  let h = 0, s = 0;
  if (mx !== mn) {
    const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60;
  }
  return `hsl(${Math.round(h)} ${Math.round(Math.min(s, .7) * 100)}% calc(var(--dotL) * 100%))`;
}

// 책 색: 표지 주색의 색상(hue)에 가장 가까운 노션 색. 읽은 기간이 겹치는 책끼리는 같은 색을 피한다
const PAL = [['red', 2], ['orange', 26], ['brown', 18], ['yellow', 42], ['green', 145], ['blue', 205], ['purple', 275], ['pink', 325]];
function hsl(hex) {
  const n = parseInt((hex || '#999999').slice(1), 16);
  const r = (n >> 16) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
  let h = 0, s = 0;
  if (mx !== mn) {
    const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    h = (mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4) * 60;
  }
  return [h, s, l];
}
function assignColors() {
  const today = iso(new Date()), done = [];
  const span = b => [b.start || b.done || today, b.done || today];
  Object.values(DATA.books).sort((a, b) => span(a)[0].localeCompare(span(b)[0])).forEach(b => {
    const [h, s] = hsl(b.color), [s0, e0] = span(b);
    const dist = x => { const d = Math.abs(h - x) % 360; return Math.min(d, 360 - d); };
    // 채도가 낮은(회색빛) 표지는 갈색·회색부터, 나머지는 색상이 가까운 순서
    let order = PAL.slice().sort((a, c) => dist(a[1]) - dist(c[1])).map(p => p[0]);
    if (s < .15) order = ['brown', 'gray', ...order.filter(c => c !== 'brown')];
    // 기간이 겹치거나 일주일 안에 이어지는 작품끼리는 다른 색 (같은 줄에 이어 붙어도 구별되게)
    const near = (x, n) => iso(new Date(toDate(x).getTime() + n * 864e5));
    const busy = new Set(done.filter(o => o.s <= near(e0, 7) && o.e >= near(s0, -7)).map(o => o.c));
    const c = order.find(x => !busy.has(x)) || order[0];
    b.pc = c; done.push({ s: s0, e: e0, c });
  });
}
const bookColor = b => `var(--c-${(b && b.pc) || 'gray'})`;

function index() {
  assignColors();
  byDay = {};
  const slot = d => (byDay[d] ||= { done: [], notes: [] });
  const months = [];
  for (const [id, b] of Object.entries(DATA.books)) if (b.done) { slot(b.done).done.push(id); months.push(ym(b.done)); }
  for (const x of DATA.notes) { slot(x.d).notes.push(x); months.push(ym(x.d)); }
  for (const b of Object.values(DATA.books)) if (b.start) months.push(ym(b.start));
  const now = new Date(), nowYM = now.getFullYear() * 12 + now.getMonth();
  minYM = Math.min(nowYM, ...months);
  maxYM = Math.max(nowYM, ...months);
  cur = nowYM;
}

function render() {
  const y = Math.floor(cur / 12), m = cur % 12;
  const first = new Date(y, m, 1), start = new Date(y, m, 1 - first.getDay());
  const today = iso(new Date());
  // 조작 버튼은 모두 왼쪽에: 오른쪽 위는 노션 임베드 도구 막대가 덮는 자리
  let html = `<div class="bar">
    <button class="nav" onclick="go(-1)" ${cur <= minYM ? 'disabled' : ''} aria-label="이전 달">‹</button>
    <button class="month" onclick="go(0)" title="이번 달">${y}년 ${m + 1}월</button>
    <button class="nav" onclick="go(1)" ${cur >= maxYM ? 'disabled' : ''} aria-label="다음 달">›</button>
    <span class="modes">
      <button class="mode ${VIEW === 'dots' ? 'on' : ''}" onclick="setView('dots')" aria-label="포스터 보기" title="포스터"><svg viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="6" height="9" rx="1"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/></svg></button>
      <button class="mode ${VIEW === 'bars' ? 'on' : ''}" onclick="setView('bars')" aria-label="기간 보기" title="본 기간"><svg viewBox="0 0 16 16"><path d="M2 4.5h9M5 8h9M2 11.5h7"/></svg></button>
    </span></div>
    <div class="week">${WD.map(w => `<div>${w}</div>`).join('')}</div><div class="grid">`;
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const key = iso(d), other = d.getMonth() !== m, e = !other && byDay[key];
    const cls = ['day', other && 'other', key === today && 'today', e && VIEW === 'dots' && 'has'].filter(Boolean).join(' ');
    let inner = `<div class="n"><span>${d.getDate()}</span></div>`;
    if (e && VIEW === 'dots') {
      if (e.done.length) inner += `<div class="covers">${e.done.slice(0, 3).map(id =>
        `<img src="${esc(DATA.books[id].cover)}" alt="" loading="lazy">`).join('')}</div>`;
      if (e.notes.length) {
        const show = e.notes.slice(0, e.notes.length > 6 ? 5 : 6);
        inner += `<div class="dots">${show.map(x => `<i class="dot" style="background:${bookColor(DATA.books[x.b])}"></i>`).join('')}${
          e.notes.length > show.length ? `<span class="more">+${e.notes.length - show.length}</span>` : ''}</div>`;
      }
    }
    html += `<div class="${cls}" data-d="${key}">${inner}</div>`;
  }
  html += `</div><p class="stats">${VIEW === 'bars' ? barStats(y, m) : stats(y, m)}</p>`;
  const box = document.getElementById('cal');
  box.innerHTML = html;
  fitHeight(box);
  if (VIEW === 'bars') drawBars(box.querySelector('.grid'), start, m);
  box.querySelectorAll('.day.has').forEach(el => {
    el.addEventListener('mouseenter', () => { if (!pinned) show(el); });
    el.addEventListener('mouseleave', () => { if (!pinned) later(); });
    el.addEventListener('click', ev => { ev.stopPropagation(); pinned = pinned === el ? null : el; pinned ? show(el) : hide(); });
  });
}

// 임베드 높이보다 길면 날짜 칸을 낮춰 위아래가 잘리지 않게 한다 (기본은 5:4 칸)
function fitHeight(box) {
  const grid = box.querySelector('.grid');
  const cells = grid.querySelectorAll('.day');
  cells.forEach(d => { d.style.aspectRatio = ''; d.style.height = ''; });
  const over = document.documentElement.scrollHeight - innerHeight;
  if (over <= 0) return;
  const h = Math.max(40, Math.floor(grid.clientHeight / 6 - over / 6) - 1);
  cells.forEach(d => { d.style.aspectRatio = 'auto'; d.style.height = h + 'px'; });
}
let fitTimer;
addEventListener('resize', () => { clearTimeout(fitTimer); fitTimer = setTimeout(() => { if (cur !== undefined) render(); }, 150); });

// ── 기간 막대 보기 ──────────────────────────────
let VIEW = 'dots';
try { VIEW = localStorage.getItem('mcal-view') === 'bars' ? 'bars' : 'dots'; } catch (e) {}
function setView(v) { VIEW = v; try { localStorage.setItem('mcal-view', v); } catch (e) {} pinned = null; hide(); render(); }
const toDate = s => { const [a, b, c] = s.split('-').map(Number); return new Date(a, b - 1, c); };
const DAY = 864e5;
const days = (a, b) => Math.round((b - a) / DAY);

// 읽은 기간: 시작한 날 ~ 완독한 날(읽는 중이면 오늘)
function periods() {
  const today = toDate(iso(new Date()));
  return Object.entries(DATA.books)
    .filter(([, b]) => b.start && (b.done || b.reading))
    .map(([id, b]) => ({ id, b, s: toDate(b.start), e: b.done ? toDate(b.done) : today, open: !b.done }))
    .filter(p => p.e >= p.s);
}

function drawBars(grid, start, m) {
  const gStart = toDate(iso(start)), gEnd = new Date(gStart.getTime() + 41 * DAY);
  const list = periods().filter(p => p.s <= gEnd && p.e >= gStart).sort((a, b) => a.s - b.s || b.e - a.e);
  // 빈 줄 채우기: 앞 막대가 끝난 다음 날부터 같은 줄을 쓴다
  const ends = [];
  list.forEach(p => { let i = ends.findIndex(e => e < p.s); if (i < 0) { i = ends.length; ends.push(0); } ends[i] = p.e; p.lane = i; });
  const used = ends.length;
  const lanes = document.createElement('div');
  lanes.className = 'lanes';
  // 막대가 칸을 넘지 않게: 먼저 간격·두께를 줄이고(최소 5px 간격·3px 두께), 그래도 넘치면 그달 칸 높이를 늘린다
  const TOP = 26, BOTTOM = 4, n = Math.min(used, 12);
  let rowH = grid.clientHeight / 6;
  let gap = n ? Math.min(9, (rowH - TOP - BOTTOM) / n) : 9;
  if (gap < 4) {
    gap = 4;
    grid.querySelectorAll('.day').forEach(d => { d.style.aspectRatio = 'auto'; d.style.height = `${TOP + n * gap + BOTTOM}px`; });
  }
  const barH = Math.max(3, Math.min(6, gap - 3));
  list.forEach(p => {
    const lane = p.lane;
    if (lane >= n) return;  // 한 칸에 12줄까지
    const color = bookColor(p.b);
    for (let r = 0; r < 6; r++) {
      const rs = new Date(gStart.getTime() + 7 * r * DAY), re = new Date(rs.getTime() + 6 * DAY);
      if (p.e < rs || p.s > re) continue;
      const a = p.s > rs ? p.s : rs, z = p.e < re ? p.e : re;
      const c0 = days(rs, a), span = days(a, z) + 1;
      const seg = document.createElement('div');
      seg.className = 'seg' + (+a === +p.s ? ' l' : '') + (+z === +p.e ? (p.open ? ' open' : ' r') : '');
      seg.dataset.id = p.id;
      seg.style.background = color;
      seg.style.left = `calc(${c0} * 100% / 7 + ${+a === +p.s ? 4 : 0}px)`;
      seg.style.width = `calc(${span} * 100% / 7 - ${(+a === +p.s ? 4 : 0) + (+z === +p.e ? 4 : 0)}px)`;
      seg.style.top = `calc(${r} * 100% / 6 + ${TOP}px + ${(lane * gap).toFixed(1)}px)`;
      seg.style.height = barH + 'px';
      seg.addEventListener('mouseenter', () => barTip(seg, p));
      seg.addEventListener('mouseleave', () => barTip(null));
      seg.addEventListener('click', ev => { ev.stopPropagation(); window.open(p.b.url, '_blank'); });
      lanes.appendChild(seg);
    }
  });
  grid.appendChild(lanes);
}

const tip = document.createElement('div');
tip.className = 'tip';
document.body.appendChild(tip);
function barTip(seg, p) {
  const lanes = document.querySelector('.lanes');
  document.querySelectorAll('.seg.hl').forEach(e => e.classList.remove('hl'));
  if (!seg) { tip.classList.remove('on'); lanes && lanes.classList.remove('focus'); return; }
  lanes.classList.add('focus');
  document.querySelectorAll(`.seg[data-id="${p.id}"]`).forEach(e => e.classList.add('hl'));
  const md = d => `${d.getMonth() + 1}/${d.getDate()}`;
  const n = days(p.s, p.e) + 1;
  tip.innerHTML = `<b>${esc(p.b.title)}</b> <span class="s">· ${KIND[p.b.k] || ''} · ${p.open ? `${md(p.s)}부터 · ${n}일째` : n === 1 ? md(p.s) : `${md(p.s)}–${md(p.e)} · ${n}일`}</span>`;
  tip.classList.add('on');
  const r = seg.getBoundingClientRect();
  tip.style.left = Math.max(4, Math.min(r.left, innerWidth - tip.offsetWidth - 4)) + 'px';
  tip.style.top = Math.max(4, r.top - tip.offsetHeight - 6) + 'px';
}

function barStats(y, m) {
  const ms = new Date(y, m, 1), me = new Date(y, m + 1, 0);
  const list = periods().filter(p => p.s <= me && p.e >= ms);
  const started = list.filter(p => p.s >= ms).length, finished = list.filter(p => !p.open && p.e <= me).length;
  if (!list.length) return `${m + 1}월 · 본 기록 없음`;
  const parts = [`${m + 1}월`, `본 작품 ${list.length}편`];
  if (started) parts.push(`새로 시작 ${started}편`);
  if (finished) parts.push(`끝냄 ${finished}편`);
  return parts.join(' · ');
}

function stats(y, m) {
  const pre = `${y}-${pad(m + 1)}`;
  const days = Object.keys(byDay).filter(d => d.startsWith(pre));
  const done = days.reduce((s, d) => s + byDay[d].done.length, 0);
  const notes = days.reduce((s, d) => s + byDay[d].notes.length, 0);
  const noteDays = days.filter(d => byDay[d].notes.length).length;
  const parts = [`${m + 1}월`];
  const doneIds = days.flatMap(d => byDay[d].done);
  if (done) parts.push(`다 본 작품 ${done}편`);
  const cnt = ks => doneIds.filter(id => ks.includes(DATA.books[id].k)).length;
  [['영화', ['movie']], ['시리즈', ['series', 'show', 'docu']], ['게임', ['game']], ['공연', ['stage']]]
    .forEach(([name, ks]) => { const c = cnt(ks); if (c) parts.push(`${name} ${c}`); });
  return parts.length > 1 ? parts.join(' · ') : `${m + 1}월 · 기록 없음`;
}

function go(step) {
  const nowYM = new Date().getFullYear() * 12 + new Date().getMonth();
  cur = step === 0 ? nowYM : Math.min(maxYM, Math.max(minYM, cur + step));
  pinned = null; hide(); render();
}

const pop = document.getElementById('pop');
let pinned = null, timer = null;
function show(el) {
  clearTimeout(timer);
  document.querySelectorAll('.day.open').forEach(x => x.classList.remove('open'));
  el.classList.add('open');
  const d = el.dataset.d, e = byDay[d], [yy, mm, dd] = d.split('-').map(Number);
  let html = `<div class="head">${mm}월 ${dd}일 (${WD[new Date(yy, mm - 1, dd).getDay()]})</div>`;
  for (const id of e.done) {
    const b = DATA.books[id];
    const kind = b.k === 'game' && b.pf ? `게임 · ${b.pf}` : KIND[b.k];
    html += `<a href="${esc(b.url)}" target="_blank" rel="noopener"><img src="${esc(b.cover || '')}" alt=""><span><b>${esc(b.title)}</b><span class="s">${kind}${b.start && b.start !== b.done ? ` · ${+b.start.slice(5, 7)}/${+b.start.slice(8, 10)}부터` : ''}${b.f ? ' · ' + esc(b.f) : ''}</span></span></a>`;
  }
  for (const x of e.notes) {
    const b = DATA.books[x.b];
    html += `<a href="${esc(x.u)}" target="_blank" rel="noopener"><i class="dot" style="background:${bookColor(b)}"></i><span><span class="t">${esc(x.t)}</span><span class="s">${esc(b.title)}</span></span></a>`;
  }
  pop.innerHTML = html;
  pop.classList.add('on');
  // 칸 오른쪽에 띄우고, 자리가 없으면 왼쪽으로. 세로는 칸 위쪽에 맞추되 화면 안으로
  const r = el.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = r.right + 6;
  if (left + pw > innerWidth - 4) left = r.left - pw - 6;
  pop.style.left = Math.max(4, Math.min(left, innerWidth - pw - 4)) + 'px';
  pop.style.top = Math.max(4, Math.min(r.top, innerHeight - ph - 4)) + 'px';
}
function hide() {
  pop.classList.remove('on');
  document.querySelectorAll('.day.open').forEach(x => x.classList.remove('open'));
}
function later() { clearTimeout(timer); timer = setTimeout(() => { if (!pinned) hide(); }, 180); }
pop.addEventListener('mouseenter', () => clearTimeout(timer));
pop.addEventListener('mouseleave', () => { if (!pinned) later(); });
document.addEventListener('click', ev => { if (!pop.contains(ev.target)) { pinned = null; hide(); } });

// 테마: 자동(기기 설정을 따름) → 라이트 → 다크 순으로 바뀜. 위젯끼리 같은 값을 쓴다
const THEME_KEY = 'widget-theme', THEMES = ['auto', 'light', 'dark'];
const THEME_ICON = {
  auto: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg>',
  light: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M3.4 12.6l1.3-1.3M11.3 4.7l1.3-1.3"/></svg>',
  dark: '<svg viewBox="0 0 16 16"><path d="M13 9.8A5.5 5.5 0 0 1 6.2 3a5.5 5.5 0 1 0 6.8 6.8z"/></svg>',
};
const THEME_NAME = { auto: '테마: 자동 (기기 설정)', light: '테마: 라이트', dark: '테마: 다크' };
function themeNow() { try { return localStorage.getItem(THEME_KEY) || 'auto'; } catch (e) { return 'auto'; } }
function applyTheme(t) {
  const root = document.documentElement;
  if (t === 'light' || t === 'dark') root.dataset.theme = t; else delete root.dataset.theme;
  document.querySelectorAll('.theme').forEach(b => { b.innerHTML = THEME_ICON[t] || THEME_ICON.auto; b.title = THEME_NAME[t]; b.setAttribute('aria-label', THEME_NAME[t]); });
}
function toggleTheme() {
  const next = THEMES[(THEMES.indexOf(themeNow()) + 1) % THEMES.length];
  try { next === 'auto' ? localStorage.removeItem(THEME_KEY) : localStorage.setItem(THEME_KEY, next); } catch (e) {}
  applyTheme(next);
}
applyTheme(themeNow());
addEventListener('storage', e => { if (e.key === THEME_KEY) applyTheme(e.newValue || 'auto'); });

const b64 = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
async function hmac(key, data) { return new Uint8Array(await crypto.subtle.sign('HMAC', key, data)); }
function cat(...parts) {
  const out = new Uint8Array(parts.reduce((n, p) => n + p.length, 0)); let i = 0;
  for (const p of parts) { out.set(p, i); i += p.length; } return out;
}
async function decrypt(blob, rawKey) {
  const key = await crypto.subtle.importKey('raw', rawKey, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const n = b64(blob.n), c = b64(blob.c), t = b64(blob.t);
  const tag = (await hmac(key, cat(new TextEncoder().encode('tag'), n, c))).slice(0, 16);
  if (tag.length !== t.length || tag.some((x, i) => x !== t[i])) throw new Error('열쇠가 맞지 않아요');
  const out = new Uint8Array(c.length);
  for (let i = 0, ctr = 0; i < c.length; i += 32, ctr++) {
    const cb = new Uint8Array(4); new DataView(cb.buffer).setUint32(0, ctr);
    const ks = await hmac(key, cat(n, cb));
    for (let j = 0; j < 32 && i + j < c.length; j++) out[i + j] = c[i + j] ^ ks[j];
  }
  return JSON.parse(new TextDecoder().decode(out));
}
// 작품 → 책 모양: done = 다 본 날(관람중이면 없음), start = 시작한 날(하루짜리는 같은 날)
function toBooks(items) {
  const books = {};
  items.forEach((x, i) => {
    books['m' + i] = { title: x.t, done: x.r ? null : x.d, start: x.s || x.d, reading: !!x.r, url: x.u,
                       cover: x.p, color: x.c, k: x.k, f: x.f, pf: x.pf };
  });
  return { books, notes: [] };
}
function notice(text) { document.getElementById('cal').innerHTML = `<p class="stats">${text}</p>`; }
(async () => {
  if (window.PREVIEW_DATA) { DATA = toBooks(window.PREVIEW_DATA.items); index(); return render(); }
  const k = new URLSearchParams(location.hash.slice(1)).get('k');
  if (!k) return notice('주소에 열쇠가 없어요.');
  try {
    const blob = await (await fetch('../archive/media.enc', { cache: 'no-store' })).json();
    DATA = toBooks((await decrypt(blob, b64(k))).items);
    index(); render();
  } catch (e) { notice('감상 캘린더를 불러오지 못했어요.'); }
})();
</script>
